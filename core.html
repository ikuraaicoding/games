<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CORE">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>CORE</title>
<style>
:root{
--crack-ratio: 0;
--shake-x: 0px;
--shake-y: 0px;
}
*{
box-sizing: border-box;
-webkit-user-select: none;
user-select: none;
-webkit-touch-callout: none;
-webkit-tap-highlight-color: transparent;
touch-action: manipulation;
}
html, body{
margin:0; padding:0; width:100%; height:100%;
background:#000;
overflow:hidden;
font-family: 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', sans-serif;
color:#ddd;
}
#app{
position:fixed;
inset:0;
background:#000;
transform: translate(var(--shake-x), var(--shake-y));
}
#pfx{ position:absolute; left:0; top:0; z-index:20; pointer-events:none; display:none; }
.screen{
position:absolute; inset:0;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding: 24px;
padding-top: max(24px, env(safe-area-inset-top));
padding-bottom: max(24px, env(safe-area-inset-bottom));
}
.screen.active{ display:flex; }

/* ---------- START SCREEN ---------- */
#start-screen h1{
font-size: 2.4rem;
letter-spacing: 0.35em;
font-weight: 300;
color:#8a1010;
text-shadow: 0 0 18px rgba(200,20,20,0.5);
margin: 0 0 6px 0;
}
#start-screen .sub{
font-size: 0.85rem;
letter-spacing:0.3em;
color:#555;
margin-bottom: 60px;
}
.btn-start{
padding: 20px 56px;
background: linear-gradient(180deg,#1a1a1a,#0a0a0a);
border: 1px solid #3a3a3a;
color:#c9c9c9;
font-size:1.1rem;
letter-spacing:0.25em;
border-radius: 4px;
box-shadow: 0 0 0 1px #000, 0 8px 24px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
cursor:pointer;
}
.btn-start:active{ background:#050505; transform: scale(0.98); }

.rules{
margin-top:50px;
max-width: 320px;
font-size:0.72rem;
line-height:1.9;
color:#4a4a4a;
letter-spacing:0.05em;
}

/* ---------- GAME SCREEN ---------- */
#game-screen{ justify-content: space-between; padding-top: max(40px, env(safe-area-inset-top)); padding-bottom: max(50px, env(safe-area-inset-bottom)); }

#status-top{
font-size:0.7rem;
letter-spacing:0.3em;
color:#444;
min-height: 20px;
}

.core-wrap{
position:relative;
width: 260px; height:260px;
display:flex; align-items:center; justify-content:center;
}

#core{
position:relative;
width: 220px; height:220px;
border-radius:50%;
background:
radial-gradient(circle at 32% 28%, #2b2b2b 0%, #121212 38%, #000 72%);
box-shadow:
0 0 0 1px #050505,
0 0 40px rgba(0,0,0,0.9),
inset 0 0 40px rgba(0,0,0,0.9),
inset -10px -10px 30px rgba(0,0,0,0.9),
inset 8px 8px 20px rgba(255,255,255,0.03);
transition: box-shadow 0.15s ease;
transform: scale(1);
animation: idleBreath 3.4s ease-in-out infinite;
}
#core.holding{
animation: none;
box-shadow:
0 0 0 1px #050505,
0 0 35px rgba(200,0,0, 0.4),
inset 0 0 40px rgba(0,0,0,0.9),
inset -10px -10px 30px rgba(0,0,0,0.9),
inset 8px 8px 20px rgba(255,255,255,0.03);
}
@keyframes idleBreath{
0%, 100%{ transform: scale(1); }
50%{ transform: scale(1.012); }
}
.core-glow{
position:absolute; inset:0;
border-radius:50%;
pointer-events:none;
background: radial-gradient(circle at 50% 50%, rgba(255,40,20,0.25), rgba(255,0,0,0) 70%);
opacity: var(--crack-ratio);
transition: opacity 0.1s linear;
}
#crack-svg{
position:absolute; inset:0;
width:100%; height:100%;
pointer-events:none;
}
#crack-svg path{
fill:none;
stroke:#ff3320;
stroke-linecap:round;
stroke-linejoin:round;
filter:
drop-shadow(0 0 2px rgba(255,255,255,0.35))
drop-shadow(0 0 6px rgba(255,20,10,0.95))
drop-shadow(0 0 14px rgba(255,0,0,0.5));
opacity:0;
transition: opacity 0.2s ease, stroke-width 0.15s ease;
}

#hint{
font-size:0.78rem;
letter-spacing:0.2em;
color:#666;
height: 24px;
}
#safe-flash{
position:absolute;
font-size:1.1rem;
letter-spacing:0.4em;
color:#6fae8a;
opacity:0;
pointer-events:none;
}
#safe-flash.show{
animation: safeFade 1.1s ease forwards;
}
@keyframes safeFade{
0%{ opacity:0; transform:translateY(6px); }
15%{ opacity:1; transform:translateY(0); }
70%{ opacity:1; }
100%{ opacity:0; }
}

#turn-counter{
font-size:0.65rem;
letter-spacing:0.3em;
color:#3a3a3a;
}
#log-panel{
margin-top: 14px;
max-height: 90px;
overflow-y: auto;
width: 240px;
font-size:0.7rem;
letter-spacing:0.05em;
color:#555;
line-height:1.9;
text-align:center;
}
#log-panel .log-entry.danger{ color:#a33; }

/* ---------- RESULT SCREEN ---------- */
#result-screen{
background:#000;
}
#result-screen h2{
font-size: 2.2rem;
letter-spacing:0.12em;
color:#e21b1b;
text-shadow: 0 0 30px rgba(255,0,0,0.6);
margin-bottom: 10px;
}
#result-screen .reason{
font-size:0.8rem;
letter-spacing:0.2em;
color:#666;
margin-bottom: 60px;
}
.btn-retry{
padding: 16px 46px;
background:#0a0a0a;
border:1px solid #3a3a3a;
color:#bbb;
font-size:1rem;
letter-spacing:0.25em;
border-radius:4px;
}
.btn-retry:active{ background:#050505; }

#flash-overlay{
position:fixed; inset:0;
background:radial-gradient(circle at center, #ffaa00 0%, #ff1100 40%, #550000 100%);
opacity:0;
pointer-events:none;
z-index: 50;
}
#flash-overlay.flashing{
animation: bigFlash 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}
@keyframes bigFlash{
0%{ opacity:0; transform: scale(0.9); }
8%{ opacity:1; transform: scale(1.05); }
25%{ opacity:0.95; transform: scale(1); }
100%{ opacity:0; transform: scale(1.2); }
}
#white-strobe{
position:fixed; inset:0;
background:#fff;
opacity:0;
pointer-events:none;
z-index: 52;
}
#white-strobe.flash{
animation: whiteStrobe 0.35s cubic-bezier(0,0,0.2,1) forwards;
}
@keyframes whiteStrobe{
0%{ opacity:0; }
10%{ opacity:1; }
25%{ opacity:0.2; }
40%{ opacity:0.9; }
100%{ opacity:0; }
}
.shock-ring{
position:absolute;
left:50%; top:50%;
width:220px; height:220px;
margin-left:-110px; margin-top:-110px;
border-radius:50%;
border: 6px solid rgba(255,200,50,0.98);
box-shadow: 0 0 50px rgba(255,80,10,0.9), inset 0 0 30px rgba(255,255,255,0.8);
opacity:0;
pointer-events:none;
}
.shock-ring.go{
animation: shockExpand 0.65s cubic-bezier(0.05, 0.7, 0.1, 1) forwards;
}
@keyframes shockExpand{
0%{ transform: scale(0.4); opacity:1; border-width:14px; }
100%{ transform: scale(4.5); opacity:0; border-width:0px; }
}
#core.core-burst{
animation: coreBurst 0.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards !important;
}
@keyframes coreBurst{
0%{ filter: brightness(1) saturate(1); transform: scale(1); opacity:1; }
20%{ filter: brightness(4.5) saturate(2.5); transform: scale(1.25); }
45%{ filter: brightness(8) saturate(3); transform: scale(1.55); }
75%{ filter: brightness(2.5) saturate(1.5); transform: scale(1.7); opacity:0.6; }
100%{ filter: brightness(0); transform: scale(1.85); opacity:0; }
}
#blackout{
position:fixed; inset:0;
background:#000;
opacity:0;
pointer-events:none;
z-index: 49;
transition: opacity 0.3s ease;
}
#blackout.on{ opacity:1; }

/* ---------- いかつい演出 ---------- */
#scanlines{
position:fixed; inset:0; z-index:40; pointer-events:none;
background: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px);
mix-blend-mode: overlay;
}
#vignette{
position:fixed; inset:0; z-index:39; pointer-events:none;
background: radial-gradient(circle at center, rgba(0,0,0,0) 35%, rgba(150,0,0,0.85) 100%);
opacity:0;
}
#fx{
position:fixed; inset:0; width:100%; height:100%;
z-index:51; pointer-events:none;
}
#start-screen h1.glitch{ animation: glitch 4.5s steps(1) infinite; }
@keyframes glitch{
0%, 92%, 100%{ transform:none; text-shadow: 0 0 18px rgba(200,20,20,0.5); }
93%{ transform:translateX(-5px); text-shadow: 3px 0 #0ff, -3px 0 #f00; }
95%{ transform:translateX(6px) skewX(8deg); text-shadow: -4px 0 #0ff, 4px 0 #f00; }
97%{ transform:translateX(-2px); text-shadow: 2px 0 #0ff, -2px 0 #f00; }
}
.stats{
font-size:0.72rem; letter-spacing:0.2em; color:#555;
line-height:2; margin: -36px 0 44px;
}
.stats b{ color:#a33; font-weight:400; }
.back{
position:absolute; left:14px; top:max(14px, env(safe-area-inset-top));
padding:10px 14px; font-size:0.8rem; letter-spacing:0.15em;
color:#777; text-decoration:none; border:1px solid #2a2a2a; border-radius:4px; background:#0a0a0a;
}
.penalty{
font-size:1.15rem; letter-spacing:0.12em; color:#f5a623;
margin: 0 0 28px; text-shadow:0 0 14px rgba(245,166,35,0.45);
}
.best-line{ margin-top:26px; font-size:0.7rem; letter-spacing:0.25em; color:#5a2a2a; min-height:1.2em; }
#core.holding{ filter: brightness(1.15); }
</style>
</head>
<body>

<div id="flash-overlay"></div>
<div id="white-strobe"></div>
<div id="blackout"></div>
<div id="vignette"></div>
<div id="scanlines"></div>
<canvas id="fx"></canvas>

<div id="app">

<!-- START -->
<div class="screen active" id="start-screen">
<a class="back" href="./index.html">‹ もどる</a>
<h1 class="glitch">CORE</h1>
<div class="sub">起 動</div>
<button class="btn-start" id="start-btn">START</button>
<div class="rules">
コアに触れ、長押しせよ。<br>
最低 1.50 秒 ── それ未満で離せば、終わる。<br>
押し続ける時間が長いほど、限界は近づく。<br>
次の者へ、コアを渡せ。<br>
<span style="color:#7a5a20">コアを爆発させた者の、負け。</span>
</div>
<div class="best-line" id="best-start"></div>
</div>

<!-- GAME -->
<div class="screen" id="game-screen">
<div id="status-top">CORE ACTIVE</div>

<div class="core-wrap">
<div id="core">
<div class="core-glow"></div>
<svg id="crack-svg" viewBox="0 0 220 220"></svg>
</div>
<div id="safe-flash">SAFE</div>
</div>

<div id="hint">コアに触れ、指を離すな</div>
<div id="turn-counter">TURN --</div>
<div id="log-panel"></div>
</div>

<!-- RESULT -->
<div class="screen" id="result-screen">
<h2>CORE CRACKED（敗北）</h2>
<div class="reason" id="reason-text"></div>
<div class="penalty" id="penalty"></div>
<div class="stats" id="stats-text"></div>
<button class="btn-retry" id="retry-btn">リトライ</button>
<a class="back" href="./index.html">‹ もどる</a>
</div>

</div>

<script src="pfx.js"></script>
<script>
(function(){
"use strict";
// 演出レイヤー(pfx.js / PixiJS)。使えないときは何もしない
const PF = window.NomiFX || new Proxy({}, { get: () => () => 0 });

const app = document.getElementById('app');
const startScreen = document.getElementById('start-screen');
const gameScreen = document.getElementById('game-screen');
const resultScreen = document.getElementById('result-screen');
const startBtn = document.getElementById('start-btn');
const retryBtn = document.getElementById('retry-btn');
const core = document.getElementById('core');
const hint = document.getElementById('hint');
const safeFlash = document.getElementById('safe-flash');
const turnCounter = document.getElementById('turn-counter');
const logPanel = document.getElementById('log-panel');
let holdLog = [];
const flashOverlay = document.getElementById('flash-overlay');
const whiteStrobe = document.getElementById('white-strobe');
const blackout = document.getElementById('blackout');
const coreWrap = document.querySelector('.core-wrap');
const reasonText = document.getElementById('reason-text');
const crackSvg = document.getElementById('crack-svg');
let cracks = [];
const vignette = document.getElementById('vignette');
const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');
const statsText = document.getElementById('stats-text');
const bestStart = document.getElementById('best-start');

// ---- ベスト記録（端末内のみ・無料） ----
let best = { turns: 0, total: 0 };
try{
const saved = JSON.parse(localStorage.getItem('core-best') || 'null');
if(saved && typeof saved.turns === 'number' && typeof saved.total === 'number') best = saved;
}catch(e){}
function saveBest(){
try{ localStorage.setItem('core-best', JSON.stringify(best)); }catch(e){}
}
function renderBestStart(){
bestStart.textContent = best.turns > 0
? 'BEST  ' + best.turns + ' TURN / ' + best.total.toFixed(2) + ' SEC'
: '';
}
renderBestStart();

// ---- 長押し中の低音ドローン ----
let drone = null;
function startDrone(){
if(!audioCtx || drone) return;
const t = audioCtx.currentTime;
const o = audioCtx.createOscillator();
o.type = 'sawtooth';
o.frequency.setValueAtTime(38, t);
const f = audioCtx.createBiquadFilter();
f.type = 'lowpass';
f.frequency.setValueAtTime(140, t);
const g = audioCtx.createGain();
g.gain.setValueAtTime(0.0001, t);
g.gain.exponentialRampToValueAtTime(0.18, t + 0.4);
o.connect(f); f.connect(g); g.connect(audioCtx.destination);
o.start(t);
drone = { o, f, g };
}
function updateDrone(held){
if(!drone) return;
const t = audioCtx.currentTime;
drone.o.frequency.setTargetAtTime(38 + Math.min(held, 12) * 3.5, t, 0.1);
drone.f.frequency.setTargetAtTime(140 + Math.min(held, 12) * 40, t, 0.1);
}
function stopDrone(){
if(!drone) return;
const t = audioCtx.currentTime;
const d = drone;
drone = null;
d.g.gain.cancelScheduledValues(t);
d.g.gain.setTargetAtTime(0.0001, t, 0.05);
d.o.stop(t + 0.3);
}

// 1.50秒を超えたかどうかが分かる演出は入れない（赤い縁は押し始めからなだらかに強まるだけ）
function resetRing(){
vignette.style.opacity = 0;
}

// ---- 偽のヒビ割れ（限界とは無関係。押し始めの0.5〜0.7秒後に1回だけ光らせて脅かす） ----
let fakeCrackTimer = null;
function cancelFakeCrack(){
if(fakeCrackTimer){ clearTimeout(fakeCrackTimer); fakeCrackTimer = null; }
}
function scheduleFakeCrack(){
cancelFakeCrack();
fakeCrackTimer = setTimeout(() => {
fakeCrackTimer = null;
if(!holding || !gameActive) return;
const level = 0.35 + Math.random() * 0.65;
const dur = 120 + Math.random() * 260;
cracks.forEach(c => {
if(Math.random() < 0.6){
c.el.style.opacity = level;
c.el.style.strokeWidth = (c.maxWidth * level).toFixed(2);
}
});
vibrateBeat(20);
setTimeout(() => { if(gameActive) setCrackRatio(0); }, dur);
}, 500 + Math.random() * 200);
}

// ---- 爆発の破片 ----
let debris = [];
let debrisRaf = null;
function resizeFx(){
const dpr = window.devicePixelRatio || 1;
fxCanvas.width = Math.floor(window.innerWidth * dpr);
fxCanvas.height = Math.floor(window.innerHeight * dpr);
fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeFx);
resizeFx();

function spawnDebris(){
const r = coreWrap.getBoundingClientRect();
const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
for(let i = 0; i < 90; i++){
const a = Math.random() * Math.PI * 2;
const sp = 3 + Math.random() * 14;
debris.push({
x: cx, y: cy,
vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
size: 2 + Math.random() * 6,
rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.5,
life: 1,
hue: Math.random() < 0.6 ? 12 + Math.random() * 30 : 0,
dark: Math.random() < 0.4
});
}
if(!debrisRaf) debrisRaf = requestAnimationFrame(stepDebris);
}
function stepDebris(){
fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
debris.forEach(p => {
p.x += p.vx; p.y += p.vy;
p.vx *= 0.975; p.vy = p.vy * 0.975 + 0.35;
p.rot += p.vr; p.life -= 0.012;
if(p.life <= 0) return;
fxCtx.save();
fxCtx.translate(p.x, p.y);
fxCtx.rotate(p.rot);
fxCtx.globalAlpha = Math.max(0, p.life);
fxCtx.fillStyle = p.dark ? '#1a1a1a' : 'hsl(' + p.hue + ',100%,55%)';
fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
fxCtx.restore();
});
debris = debris.filter(p => p.life > 0);
if(debris.length){
debrisRaf = requestAnimationFrame(stepDebris);
}else{
debrisRaf = null;
fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
}
}
function clearDebris(){
debris = [];
if(debrisRaf){ cancelAnimationFrame(debrisRaf); debrisRaf = null; }
fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
}

let audioCtx = null;

let threshold = 0;
let totalHeld = 0;
let holding = false;
let holdStartTime = 0;
let rafId = null;
let beatTimeoutId = null;
let cooldown = false;
let gameActive = false;
let turn = 0;

// 脈動アニメ用タイマー（爆発・リセット時にまとめて止める）
let pulseTimers = [];
let resultTimers = [];
let shakeIntervalId = null;
let cooldownTimerId = null;

function pulseLater(fn, ms){
pulseTimers.push(setTimeout(fn, ms));
}
function clearPulseTimers(){
pulseTimers.forEach(clearTimeout);
pulseTimers = [];
}
function clearResultTimers(){
resultTimers.forEach(clearTimeout);
resultTimers = [];
if(shakeIntervalId){ clearInterval(shakeIntervalId); shakeIntervalId = null; }
}

function initAudio(){
if(!audioCtx){
const AC = window.AudioContext || window.webkitAudioContext;
audioCtx = new AC();
}
if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
}

function showScreen(el){
[startScreen, gameScreen, resultScreen].forEach(s => s.classList.remove('active'));
el.classList.add('active');
}

function renderLog(){
logPanel.innerHTML = holdLog.map(entry => {
const cls = entry.danger ? 'log-entry danger' : 'log-entry';
return `<div class="${cls}">${entry.text}</div>`;
}).join('');
logPanel.scrollTop = logPanel.scrollHeight;
}

function randRange(a, b){ return a + Math.random() * (b - a); }

function generateCracks(){
crackSvg.innerHTML = '';
cracks = [];
const count = 7 + Math.floor(Math.random() * 3);
const cx = 110, cy = 110;
const baseAngle = Math.random() * 360;

for(let i = 0; i < count; i++){
const angle = (baseAngle + (360 / count) * i + randRange(-16, 16)) * Math.PI / 180;
const dx = Math.cos(angle), dy = Math.sin(angle);
const px = -dy, py = dx;
const segs = 3 + Math.floor(Math.random() * 3);
let r = randRange(12, 26);
let x = cx + dx * r, y = cy + dy * r;
let d = 'M' + x.toFixed(1) + ',' + y.toFixed(1);
for(let s = 0; s < segs; s++){
r += randRange(14, 26);
const perp = randRange(-13, 13);
x = cx + dx * r + px * perp;
y = cy + dy * r + py * perp;
d += ' L' + x.toFixed(1) + ',' + y.toFixed(1);
}
const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
path.setAttribute('d', d);
crackSvg.appendChild(path);
cracks.push({
el: path,
maxWidth: randRange(2.0, 3.5)
});
}
}

function resetGameState(){
cancelScare();
stopDrone();
clearDebris();
resetRing();
cancelFakeCrack();
clearPulseTimers();
clearResultTimers();
if(cooldownTimerId){ clearTimeout(cooldownTimerId); cooldownTimerId = null; }
if(rafId) cancelAnimationFrame(rafId);
if(beatTimeoutId) clearTimeout(beatTimeoutId);
threshold = 7 + Math.random() * 23;
totalHeld = 0;
holding = false;
cooldown = false;
turn = 0;
holdLog = [];
renderLog();
core.classList.remove('holding');
core.classList.remove('core-burst');
core.style.transform = '';
core.style.transition = '';
app.style.setProperty('--shake-x', '0px');
app.style.setProperty('--shake-y', '0px');
blackout.classList.remove('on');
flashOverlay.classList.remove('flashing');
whiteStrobe.classList.remove('flash');
coreWrap.querySelectorAll('.shock-ring').forEach(r => r.remove());
generateCracks();
setCrackRatio(0);
turnCounter.textContent = 'TURN --';
hint.textContent = 'コアに触れ、指を離すな';
}

function setCrackRatio(ratio){
ratio = Math.max(0, Math.min(1, ratio));
core.style.setProperty('--crack-ratio', ratio.toFixed(3));
cracks.forEach((c) => {
c.el.style.opacity = ratio;
c.el.style.strokeWidth = (c.maxWidth * ratio).toFixed(2);
});
}

function shakePulse(intensity){
const x = (Math.random() - 0.5) * intensity;
const y = (Math.random() - 0.5) * intensity;
app.style.setProperty('--shake-x', x.toFixed(2) + 'px');
app.style.setProperty('--shake-y', y.toFixed(2) + 'px');
resultTimers.push(setTimeout(() => {
app.style.setProperty('--shake-x', '0px');
app.style.setProperty('--shake-y', '0px');
}, 90));
}

function pulseCore(intensity){
const s1 = 1 + 0.03 * intensity;
core.style.transition = 'transform 0.09s ease-out';
core.style.transform = `scale(${s1.toFixed(3)})`;
pulseLater(() => {
core.style.transition = 'transform 0.12s ease-in';
core.style.transform = 'scale(0.996)';
pulseLater(() => {
const s2 = 1 + 0.015 * intensity;
core.style.transition = 'transform 0.08s ease-out';
core.style.transform = `scale(${s2.toFixed(3)})`;
pulseLater(() => {
core.style.transition = 'transform 0.22s ease-in';
core.style.transform = 'scale(1)';
}, 90);
}, 110);
}, 100);
}

function spawnShockwave(delay){
resultTimers.push(setTimeout(() => {
const ring = document.createElement('div');
ring.className = 'shock-ring';
coreWrap.appendChild(ring);
requestAnimationFrame(() => ring.classList.add('go'));
resultTimers.push(setTimeout(() => ring.remove(), 700));
}, delay));
}

function explosionShake(){
let tick = 0;
const totalTicks = 24;
shakeIntervalId = setInterval(() => {
tick++;
const amp = Math.max(3, 40 * (1 - tick / totalTicks));
shakePulse(amp);
if(tick >= totalTicks){
clearInterval(shakeIntervalId);
shakeIntervalId = null;
}
}, 25);
}

function playHeartbeat(){
if(!audioCtx) return;
const t = audioCtx.currentTime;

const o1 = audioCtx.createOscillator();
o1.type = 'sine';
o1.frequency.setValueAtTime(58, t);
const g1 = audioCtx.createGain();
g1.gain.setValueAtTime(0.0001, t);
g1.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
o1.connect(g1); g1.connect(audioCtx.destination);
o1.start(t); o1.stop(t + 0.25);

const o2 = audioCtx.createOscillator();
o2.type = 'sine';
o2.frequency.setValueAtTime(46, t + 0.16);
const g2 = audioCtx.createGain();
g2.gain.setValueAtTime(0.0001, t + 0.16);
g2.gain.exponentialRampToValueAtTime(0.4, t + 0.18);
g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);
o2.connect(g2); g2.connect(audioCtx.destination);
o2.start(t + 0.16); o2.stop(t + 0.4);
}

function playExplosionSound(){
if(!audioCtx) return;
const t = audioCtx.currentTime;

const bufferSize = Math.floor(audioCtx.sampleRate * 1.2);
const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const data = buffer.getChannelData(0);
for(let i = 0; i < bufferSize; i++){
data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
}
const noise = audioCtx.createBufferSource();
noise.buffer = buffer;
const noiseFilter = audioCtx.createBiquadFilter();
noiseFilter.type = 'lowpass';
noiseFilter.frequency.setValueAtTime(600, t);
noiseFilter.frequency.exponentialRampToValueAtTime(60, t + 1.0);
const noiseGain = audioCtx.createGain();
noiseGain.gain.setValueAtTime(1.5, t);
noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
noise.connect(noiseFilter);
noiseFilter.connect(noiseGain);
noiseGain.connect(audioCtx.destination);
noise.start(t);

[420, 580, 890, 1250].forEach((freq, idx) => {
const so = audioCtx.createOscillator();
so.type = idx % 2 === 0 ? 'sawtooth' : 'square';
so.frequency.setValueAtTime(freq, t);
so.frequency.exponentialRampToValueAtTime(freq * 0.2, t + 0.3);
const sg = audioCtx.createGain();
sg.gain.setValueAtTime(0.25, t);
sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
so.connect(sg); sg.connect(audioCtx.destination);
so.start(t); so.stop(t + 0.4);
});

const o = audioCtx.createOscillator();
o.type = 'sine';
o.frequency.setValueAtTime(3800, t + 0.02);
const g = audioCtx.createGain();
g.gain.setValueAtTime(0.0001, t);
g.gain.exponentialRampToValueAtTime(0.5, t + 0.05);
g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
o.connect(g); g.connect(audioCtx.destination);
o.start(t); o.stop(t + 3.3);
}

function vibrateBeat(intensity){
if('vibrate' in navigator){
navigator.vibrate(intensity);
}
}

function vibrateExplosion(){
if('vibrate' in navigator){
navigator.vibrate([0, 120, 50, 120, 80, 300, 100, 500, 150, 600]);
}
}

// ---- ドッキリ罠：押し始めの1秒以内に、思わず離させる ----
// 毎回は起きない（約35%）。起きるタイミングも種類もランダム。限界時間とは無関係。
let scareTimerId = null;
function cancelScare(){
if(scareTimerId){ clearTimeout(scareTimerId); scareTimerId = null; }
}
function scheduleScare(){
cancelScare();
if(Math.random() >= 0.35) return;
scareTimerId = setTimeout(doScare, 200 + Math.random() * 650);
}
function playScareSound(){
if(!audioCtx) return;
const t = audioCtx.currentTime;
const len = Math.floor(audioCtx.sampleRate * 0.5);
const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
const d = buf.getChannelData(0);
for(let i = 0; i < len; i++){
d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
}
const n = audioCtx.createBufferSource();
n.buffer = buf;
const ng = audioCtx.createGain();
ng.gain.setValueAtTime(1.4, t);
ng.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
n.connect(ng); ng.connect(audioCtx.destination);
n.start(t);
const o = audioCtx.createOscillator();
o.type = 'sawtooth';
o.frequency.setValueAtTime(900, t);
o.frequency.exponentialRampToValueAtTime(60, t + 0.25);
const og = audioCtx.createGain();
og.gain.setValueAtTime(0.5, t);
og.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
o.connect(og); og.connect(audioCtx.destination);
o.start(t); o.stop(t + 0.35);
}
function doScare(){
scareTimerId = null;
if(!holding || !gameActive) return;
const kind = Math.floor(Math.random() * 3);
playScareSound();
if('vibrate' in navigator) navigator.vibrate([80, 30, 120]);
shakePulse(34);
if(kind === 0){
// 閃光
whiteStrobe.classList.remove('flash');
void whiteStrobe.offsetWidth;
whiteStrobe.classList.add('flash');
}else if(kind === 1){
// ヒビが全開 + 炎のフラッシュ（爆発したかに見せる）
setCrackRatio(1);
flashOverlay.classList.remove('flashing');
void flashOverlay.offsetWidth;
flashOverlay.classList.add('flashing');
resultTimers.push(setTimeout(() => { if(gameActive) setCrackRatio(0); }, 350));
}else{
// コアが一瞬ふくらむ + 激しい揺れ
core.style.transition = 'transform 0.06s ease-out';
core.style.transform = 'scale(1.18)';
resultTimers.push(setTimeout(() => {
if(!gameActive) return;
core.style.transition = 'transform 0.25s ease-in';
core.style.transform = 'scale(1)';
}, 120));
shakePulse(48);
}
}

function beatLoop(){
if(!holding) return;
playHeartbeat();
const held = (performance.now() - holdStartTime) / 1000;
pulseCore(0.6 + Math.min(held, 10) * 0.07);
shakePulse(Math.min(7, held * 0.7));
vibrateBeat(35 + Math.min(held, 10) * 6);
// 今回の長押しが長いほど鼓動が速くなる（限界の情報は含まない）
const interval = Math.max(330, 620 - held * 32);
beatTimeoutId = setTimeout(beatLoop, interval);
}

function frameLoop(){
if(!holding) return;
const now = performance.now();
const currentHeld = (now - holdStartTime) / 1000;
const projected = totalHeld + currentHeld;

vignette.style.opacity = Math.min(1, currentHeld / 9).toFixed(3);
updateDrone(currentHeld);

if(projected >= threshold){
holdLog.push({ text: (turn + 1) + '回目: ' + currentHeld.toFixed(2) + '秒（爆発）', danger:true });
renderLog();
triggerExplosion('limit', currentHeld);
return;
}
rafId = requestAnimationFrame(frameLoop);
}

function onPress(e){
if(e.cancelable) e.preventDefault();
if(!gameActive || holding || cooldown) return;
holding = true;
holdStartTime = performance.now();
hint.textContent = '長押し中……';
core.classList.add('holding');
PF.aura(core, true, 0xff453a);
startDrone();
scheduleScare();
scheduleFakeCrack();
beatLoop();
rafId = requestAnimationFrame(frameLoop);
}

function onRelease(e){
if(e.cancelable) e.preventDefault();
if(!holding) return;
const now = performance.now();
const currentHeld = (now - holdStartTime) / 1000;

holding = false;
PF.aura(core, false);
if(rafId) cancelAnimationFrame(rafId);
if(beatTimeoutId) clearTimeout(beatTimeoutId);
clearPulseTimers();
cancelScare();
cancelFakeCrack();
stopDrone();
resetRing();
setCrackRatio(0);
core.style.transition = 'transform 0.2s ease-in';
core.style.transform = 'scale(1)';
core.classList.remove('holding');

if(currentHeld < 1.5){
holdLog.push({ text: (turn + 1) + '回目: ' + currentHeld.toFixed(2) + '秒（早離れ）', danger:true });
renderLog();
triggerExplosion('early', currentHeld);
return;
}

totalHeld += currentHeld;
turn += 1;
holdLog.push({ text: turn + '回目: ' + currentHeld.toFixed(2) + '秒', danger:false });
renderLog();
turnCounter.textContent = 'TURN ' + turn;
hint.textContent = '次の者へ、コアを渡せ';

safeFlash.classList.remove('show');
void safeFlash.offsetWidth;
safeFlash.classList.add('show');
PF.pop(core, { color: 0x30d158, power: 1.6 });

cooldown = true;
cooldownTimerId = setTimeout(() => { cooldown = false; }, 750);
}

function triggerExplosion(reason, duration){
gameActive = false;
holding = false;
PF.aura(core, false); PF.fireball(core);
if(rafId) cancelAnimationFrame(rafId);
if(beatTimeoutId) clearTimeout(beatTimeoutId);
clearPulseTimers();
cancelScare();
cancelFakeCrack();
stopDrone();
resetRing();
core.classList.remove('holding');
core.style.transition = '';
core.style.transform = '';

setCrackRatio(1);

// 結果の集計とベスト更新
const survivedTotal = totalHeld;
const isNewBest = turn > best.turns || (turn === best.turns && survivedTotal > best.total);
if(isNewBest){
best = { turns: turn, total: survivedTotal };
saveBest();
renderBestStart();
}
statsText.innerHTML = (reason === 'early'
? 'ここまでの合計 <b>' + survivedTotal.toFixed(2) + '</b> SEC ／ 最後の長押し <b>' + duration.toFixed(2) + '</b> SEC（1.50秒未満）'
: '爆発までの合計 <b>' + (survivedTotal + duration).toFixed(2) + '</b> SEC<br>（生き残り ' + survivedTotal.toFixed(2) + ' ＋ 最後の長押し ' + duration.toFixed(2) + '）') +
'<br>生還 <b>' + turn + '</b> TURN' +
'<br>BEST ' + best.turns + ' TURN ／ ' + best.total.toFixed(2) + ' SEC' +
(isNewBest && turn > 0 ? '<br><b>NEW RECORD</b>' : '');

spawnDebris();
playExplosionSound();
vibrateExplosion();

core.classList.add('core-burst');
explosionShake();

spawnShockwave(0);
spawnShockwave(70);
spawnShockwave(140);
spawnShockwave(220);

whiteStrobe.classList.remove('flash');
void whiteStrobe.offsetWidth;
whiteStrobe.classList.add('flash');

flashOverlay.classList.remove('flashing');
void flashOverlay.offsetWidth;
flashOverlay.classList.add('flashing');

resultTimers.push(setTimeout(() => {
blackout.classList.add('on');
}, 280));

resultTimers.push(setTimeout(() => {
reasonText.textContent = reason === 'early'
? '1.50秒に満たず、' + duration.toFixed(2) + '秒で指が離れた'
: duration.toFixed(2) + '秒で限界を超え、コアが弾けた';
document.getElementById('penalty').textContent = '💀 爆発させた人の負け!';
showScreen(resultScreen);
blackout.classList.remove('on');
flashOverlay.classList.remove('flashing');
whiteStrobe.classList.remove('flash');
core.classList.remove('core-burst');
core.style.transform = '';
core.style.transition = '';
}, 1100));
}

function startGame(){
initAudio();
resetGameState();
gameActive = true;
showScreen(gameScreen);
PF.load(); PF.show(true, { amb: [0xff453a, 0xff8a80, 0xff9f0a] });
}

startBtn.addEventListener('click', startGame);

// リトライはスタート画面を挟まず、そのまま次のゲームを始める
retryBtn.addEventListener('click', startGame);

core.addEventListener('pointerdown', onPress, { passive:false });
core.addEventListener('pointerup', onRelease, { passive:false });
core.addEventListener('pointercancel', onRelease, { passive:false });
core.addEventListener('pointerleave', (e) => {
if(holding) onRelease(e);
}, { passive:false });

core.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());

if('serviceWorker' in navigator){
window.addEventListener('load', () => {
navigator.serviceWorker.register('sw.js').catch(() => {});
});
}

})();
</script>
