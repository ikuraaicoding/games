<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PARTY PACK">
<meta name="theme-color" content="#09090b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>PARTY PACK</title>
<link rel="stylesheet" href="ui.css">
<style>
.screen{ position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; overflow-y:auto; padding:max(28px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom)); }
.wrap{ width:100%; max-width:460px; margin:0 auto; display:flex; flex-direction:column; flex:1; }
.hero{ margin:18px 0 26px; }
.hero h1{ margin:10px 0 10px; font-size:2.6rem; }
.hero h1 span{ color:var(--dim); }
.hero p{ margin:0; color:var(--sub); font-size:.86rem; line-height:1.7; }
.sec{ display:flex; align-items:baseline; justify-content:space-between; margin:18px 2px 10px; }
.sec small{ font-size:.7rem; color:var(--dim); }
.cards{ display:grid; gap:10px; }
.gcard{ display:flex; align-items:center; gap:14px; width:100%; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; transition:transform .08s, background .15s, border-color .15s; }
.gcard:active{ transform:scale(.985); background:var(--surface2); border-color:var(--acc); }
.gtxt{ flex:1; min-width:0; }
.gtxt .nm{ display:flex; align-items:baseline; gap:8px; }
.gtxt b{ font-size:1.25rem; font-weight:800; letter-spacing:.01em; }
.gtxt em{ font-style:normal; font-size:.74rem; color:var(--acc); font-weight:600; }
.gtxt small{ display:block; margin-top:4px; color:var(--sub); font-size:.74rem; line-height:1.55; }
.chev{ color:var(--dim); width:18px!important; height:18px!important; }
.note{ text-align:center; font-size:.68rem; color:var(--dim); margin-top:auto; padding-top:28px; line-height:1.8; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-core" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12.6 3.6l-1.9 4.3 2.7 2.3-2.4 3.4 1.9 3.1-.8 3.7"/></symbol>
  <symbol id="i-draw" viewBox="0 0 24 24"><path d="M13.5 2.5 5 13.5h6l-1 8 8.5-11h-6z"/></symbol>
  <symbol id="i-blind" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M10 2.5h4M12 2.5V6"/><path d="M4.5 6 19.5 21"/></symbol>
  <symbol id="i-thumbs" viewBox="0 0 24 24"><path d="M7.5 12V5.5a2 2 0 0 1 4 0V12"/><rect x="5" y="12" width="14" height="9" rx="3"/><path d="M11.5 15.5H19M11.5 18.5H19"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
</svg>

<div class="screen"><div class="wrap">
  <header class="hero">
    <div class="eyebrow">Game Collection</div>
    <h1 class="wordmark">PARTY<br><span>PACK</span></h1>
    <p>スマホで遊ぶ、度胸と反応のパーティーゲーム。</p>
  </header>

  <div class="sec"><span class="eyebrow">Online</span><small>各自のスマホで・QRを1回読むだけ</small></div>
  <div class="cards">
    <a class="gcard g-tap" href="online.html#tap">
      <span class="tile"><svg class="ic"><use href="#i-draw"/></svg></span>
      <span class="gtxt"><span class="nm"><b>DRAW</b><em>早撃ち</em></span><small>合図で一斉に指を離す。いちばん遅い人の負け。</small></span>
      <svg class="ic chev"><use href="#i-chev"/></svg>
    </a>
    <a class="gcard g-stop" href="online.html#stop">
      <span class="tile"><svg class="ic"><use href="#i-blind"/></svg></span>
      <span class="gtxt"><span class="nm"><b>BLIND</b><em>見えないタイマー</em></span><small>目標の秒数ぴったりで離す。時間は3秒で消える。</small></span>
      <svg class="ic chev"><use href="#i-chev"/></svg>
    </a>
    <a class="gcard g-ise" href="online.html#ise">
      <span class="tile"><svg class="ic"><use href="#i-thumbs"/></svg></span>
      <span class="gtxt"><span class="nm"><b>THUMBS</b><em>いっせーのーせ</em></span><small>親指の合計を読み合って、ライフを削り合う。</small></span>
      <svg class="ic chev"><use href="#i-chev"/></svg>
    </a>
    <a class="gcard g-core" href="online.html#core">
      <span class="tile"><svg class="ic"><use href="#i-core"/></svg></span>
      <span class="gtxt"><span class="nm"><b>CORE</b><em>爆弾リレー</em></span><small>コアを長押しして次の人へ。限界は誰にも分からない。</small></span>
      <svg class="ic chev"><use href="#i-chev"/></svg>
    </a>
  </div>

  <div class="sec"><span class="eyebrow">Offline</span><small>スマホ1台を回して・通信なし</small></div>
  <div class="cards">
    <a class="gcard g-core" href="core.html">
      <span class="tile"><svg class="ic"><use href="#i-core"/></svg></span>
      <span class="gtxt"><span class="nm"><b>CORE</b><em>1台で回す</em></span><small>1台のスマホを順番に回して遊ぶ版。</small></span>
      <svg class="ic chev"><use href="#i-chev"/></svg>
    </a>
  </div>

  <div class="note">参加用のQRは、目の前の人にだけ見せてください。</div>
</div></div>
<script src="hub.js"></script>
</body>
</html>
